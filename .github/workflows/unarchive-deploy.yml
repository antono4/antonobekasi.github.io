name: Unarchive & Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Batasi jumlah repo (0 = semua)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  unarchive-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unarchive + deploy
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error, urllib.parse

          OWNER = "antono4"
          EXCLUDE = {"antono4"}
          WORKFLOW_PATH = ".github/workflows/generate-readme.yml"
          TOKEN = os.environ["ADMIN_TOKEN"]
          LIMIT = int(os.environ.get("LIMIT") or 0)
          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      payload = r.read()
                      return r.status, json.loads(payload) if payload else {}
              except urllib.error.HTTPError as e:
                  payload = e.read()
                  try:
                      parsed = json.loads(payload)
                  except Exception:
                      parsed = {"raw": payload.decode(errors="replace")}
                  return e.code, parsed

          # Baca isi generate-readme.yml dari repo ini (antonobekasi.github.io)
          with open(WORKFLOW_PATH, "rb") as f:
              content_b64 = base64.b64encode(f.read()).decode()

          # Daftar semua repo
          repos, page = [], 1
          while True:
              st, data = api("GET", f"https://api.github.com/users/{OWNER}/repos?per_page=100&type=owner&page={page}")
              if st != 200:
                  raise SystemExit(f"list repos failed: {st} {data}")
              if not data:
                  break
              repos.extend(data)
              page += 1

          archived = [r for r in repos if r["archived"] and r["name"] not in EXCLUDE]
          print(f"Archived repos to process: {len(archived)}")
          if LIMIT:
              archived = archived[:LIMIT]
              print(f"LIMIT mode: {len(archived)}")

          counts = {"unarchived": 0, "failed_unarchive": 0,
                    "workflow_created": 0, "workflow_updated": 0, "workflow_failed": 0}
          failures = []

          for i, r in enumerate(archived, 1):
              name = r["name"]
              branch = r["default_branch"]

              # Unarchive
              st, data = api("PATCH", f"https://api.github.com/repos/{OWNER}/{name}", {"archived": False})
              if st == 200 and data.get("archived") is False:
                  counts["unarchived"] += 1
                  print(f"[{i}/{len(archived)}] {name}: unarchived")
              else:
                  counts["failed_unarchive"] += 1
                  failures.append(f"{name}: unarchive failed {st} {json.dumps(data)[:120]}")
                  print(f"[{i}/{len(archived)}] {name}: UNARCHIVE FAILED {st}")
                  if st in (403, 429):
                      time.sleep(3)
                  time.sleep(0.4)
                  continue

              # Deploy workflow (create atau update)
              get_url = f"https://api.github.com/repos/{OWNER}/{name}/contents/{WORKFLOW_PATH}?ref={urllib.parse.quote(branch)}"
              gst, gdata = api("GET", get_url)
              sha = gdata.get("sha") if gst == 200 and isinstance(gdata, dict) else None

              body = {"message": "ci: add generate-readme workflow (hourly)\n\nCo-authored-by: openhands <openhands@all-hands.dev>",
                      "content": content_b64, "branch": branch}
              if sha:
                  body["sha"] = sha
              pst, pdata = api("PUT", f"https://api.github.com/repos/{OWNER}/{name}/contents/{WORKFLOW_PATH}", body)
              if pst in (200, 201):
                  key = "workflow_updated" if sha else "workflow_created"
                  counts[key] += 1
                  print(f"[{i}/{len(archived)}] {name}: workflow {'updated' if sha else 'created'}")
              else:
                  counts["workflow_failed"] += 1
                  failures.append(f"{name}: workflow failed {pst} {json.dumps(pdata)[:120]}")
                  print(f"[{i}/{len(archived)}] {name}: WORKFLOW FAILED {pst}")

              time.sleep(0.4)

          print("\n=== SUMMARY ===")
          print(json.dumps(counts, indent=2))
          if failures:
              print(f"\n{len(failures)} failures:")
              for f in failures:
                  print(f"  - {f}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"## Unarchive & Deploy Summary\n\n```json\n{json.dumps(counts, indent=2)}\n```\n")
              if failures:
                  s.write(f"\n### Failures ({len(failures)})\n\n")
                  for f in failures:
                      s.write(f"- {f}\n")
          PY
